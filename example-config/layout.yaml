- block:
    title: VISUALIZER
  component_type:
    Provider:
      layout:
          - Graph:
              fg: Green
              var: visualizer.bins
  constraint:
    Length: 35
- block:
    title: CLOCK
  # Sets the width of the widget: https://docs.rs/ratatui/0.30.0/ratatui/prelude/enum.Constraint.html
  constraint:
    Length: 30
  component_type:
    Provider:
      # Each element in the list corresponds to a height
      # If the bar is larger the last element will get picked
      layout:
        # 1
      - HGroup:
          elements:
          # Use ${provider.var_name} to get a variable from the provider
          # Use $[ul](text ${provider.variable}) to underline text and variables 
          - Text: ${clock.day}
          - Text: ${clock.time}
          - Text: ${clock.date}
        # 2
      - HGroup:
          elements:
          - VGroup:
              elements:
              - Text: DAY
              - Text: ${clock.day}
          - VGroup:
              elements:
              - Text: TIME
              - Text: ${clock.time}
          - VGroup:
              elements:
              - Text: DATE
              - Text: ${clock.date}

- block:
    title: NOW PLAYING
  constraint:
    Length: 70
  component_type:
    Provider:
      layout:
      - HGroup:
          elements:
          - Image:
              var: now-playing.art
              width: 2
          - HGroup:
              elements:
              - Text: $[ul](${now-playing.title}) | $[ul](${now-playing.artist})
              width:
                Percentage: 70
          - Text: ${now-playing.buttons}
          - HGroup:
              elements:
              - Bar:
                  direction: Horizontal
                  var: now-playing.progress
                  fg: Red
                  bg: DarkGray
              width:
                Percentage: 30
          - Text: ${now-playing.position}/${now-playing.length}
      - HGroup:
          elements:
          - Image:
              var: now-playing.art
              width: 5
          - VGroup:
              elements:
              - Text: ${now-playing.title}
              - Text: $[ul](${now-playing.album}) | $[ul](${now-playing.artist})
              width:
                Percentage: 60
          - VGroup:
              elements:
              - HGroup:
                  elements:
                  - Text: ${now-playing.buttons}
                  - Text: ${now-playing.position}/${now-playing.length}
              - Bar:
                  direction: Horizontal
                  var: now-playing.progress
                  fg: Red
                  bg: DarkGray
              width:
                Percentage: 40

- block:
    title: CPU
  constraint:
    Length: 35
  component_type:
    Provider:
      layout:
      - HGroup:
          elements:
          - Text: 'LOAD: ${cpu.load}%'
          - Text: 'FREQ: ${cpu.freq}GHZ'
          - Bar:
              direction: Horizontal
              var: cpu.load
              fg: Blue
              bg: DarkGray
      - HGroup:
          elements:
          - VGroup:
              elements:
              - Text: LOAD
              - Text: ${cpu.load}%
          - VGroup:
              elements:
              - Text: FREQ
              - Text: ${cpu.freq}GHZ
          - Graph:
              var: cpu.acc
              fg: Blue

- block:
    title: MEM
  constraint:
    Length: 27
  component_type:
    Provider:
      layout:
      - HGroup:
          elements:
          - Text: ${mem.used}GB/${mem.total}GB
          - Bar:
              direction: Horizontal
              var: mem.percent
              fg: Yellow
              bg: DarkGray
      - HGroup:
          elements:
          - VGroup:
              elements:
              - Text: FREE
              - Text: ${mem.available}GB
          - VGroup:
              elements:
              - Text: USED
              - Text: ${mem.used}GB
          - VGroup:
              elements:
              - Text: TOTAL
              - Text: ${mem.total}GB
          - Bar:
              direction: Vertical
              var: mem.percent
              fg: Yellow
              bg: DarkGray
